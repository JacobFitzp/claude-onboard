<svg width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="160" fill="url(#bg)" rx="12"/>
  <rect width="800" height="160" fill="none" stroke="#30363d" stroke-width="1" rx="12"/>

  <!-- Slider 1: Communication — purple (70%) -->
  <text x="44" y="30" font-family="ui-monospace, monospace" font-size="10" fill="#6e7681" letter-spacing="1.5">COMMUNICATION</text>
  <rect x="44" y="37" width="230" height="3" fill="#21262d" rx="1.5"/>
  <rect x="44" y="37" width="161" height="3" fill="#7c3aed" rx="1.5"/>
  <circle cx="205" cy="38.5" r="7" fill="#7c3aed" stroke="#0d1117" stroke-width="2.5"/>

  <!-- Slider 2: Code — blue (45%) -->
  <text x="44" y="66" font-family="ui-monospace, monospace" font-size="10" fill="#6e7681" letter-spacing="1.5">CODE</text>
  <rect x="44" y="73" width="230" height="3" fill="#21262d" rx="1.5"/>
  <rect x="44" y="73" width="103" height="3" fill="#3b82f6" rx="1.5"/>
  <circle cx="147" cy="74.5" r="7" fill="#3b82f6" stroke="#0d1117" stroke-width="2.5"/>

  <!-- Slider 3: Tasks — cyan (85%) -->
  <text x="44" y="102" font-family="ui-monospace, monospace" font-size="10" fill="#6e7681" letter-spacing="1.5">TASKS</text>
  <rect x="44" y="109" width="230" height="3" fill="#21262d" rx="1.5"/>
  <rect x="44" y="109" width="195" height="3" fill="#06b6d4" rx="1.5"/>
  <circle cx="239" cy="110.5" r="7" fill="#06b6d4" stroke="#0d1117" stroke-width="2.5"/>

  <!-- Slider 4: Output & Git — orange (30%) -->
  <text x="44" y="138" font-family="ui-monospace, monospace" font-size="10" fill="#6e7681" letter-spacing="1.5">OUTPUT &amp; GIT</text>
  <rect x="44" y="145" width="230" height="3" fill="#21262d" rx="1.5"/>
  <rect x="44" y="145" width="69" height="3" fill="#f97316" rx="1.5"/>
  <circle cx="113" cy="146.5" r="7" fill="#f97316" stroke="#0d1117" stroke-width="2.5"/>

  <!-- Divider -->
  <line x1="326" y1="18" x2="326" y2="142" stroke="#21262d" stroke-width="1"/>

  <!-- Title -->
  <text x="360" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e6edf3">Claude Onboard</text>

  <!-- /onboard pill -->
  <rect x="360" y="88" width="94" height="22" fill="#161b22" stroke="#30363d" stroke-width="1" rx="6"/>
  <text x="373" y="104" font-family="ui-monospace, monospace" font-size="12" fill="#7c3aed">/onboard</text>

  <!-- Subtitle -->
  <text x="362" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="13" fill="#8b949e">Configure once. Remembered forever.</text>

  <!-- Stats line -->
  <text x="362" y="148" font-family="ui-monospace, monospace" font-size="11" fill="#484f58">16 preferences · global or per-project · persistent</text>
</svg>
